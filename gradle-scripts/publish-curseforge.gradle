if (gradle.parent != null) {
    return
}

def vsReleaseType = 'alpha'
if (project.hasProperty("CustomReleaseVersion")) {
    def tag = project.property("CustomReleaseVersion")
    def matches = tag =~ /^release\/(?:\d+\.){1,2}\d+(?:-(alpha|beta)\.\d+)?$/
    if (!matches.matches()) {
        throw new GradleException("Invalid Kelvin release tag: ${tag}")
    }
    vsReleaseType = matches.group(1) ?: 'release'
}

def fileDisplayName = "[${project.loader_platform} ${project.minecraft_version}] v${project.version}"

// upgrade curseforge release type if it's an alpha,
// because alpha can't be installed from the curseforge app
def curseForgeReleaseType = vsReleaseType == 'alpha' ? 'beta' : vsReleaseType

// Publish to CurseForge
tasks.register('curseforge') {
    dependsOn remapJar

    doLast {
        if (!project.curse_api_key) {
            throw new GradleException('Set the CurseForge upload token before publishing')
        }

        def metadata = [
            displayName: fileDisplayName,
            releaseType: curseForgeReleaseType,
            changelog: '',
            gameVersionNames: [project.minecraft_version, project.loader_platform, 'Client', 'Server']
        ]

        def jarFile = remapJar.archiveFile.get().asFile
        project.exec {
            standardInput = new ByteArrayInputStream("X-Api-Token: ${project.curse_api_key}\n".getBytes('UTF-8'))
            commandLine 'curl', '--fail-with-body', '--silent', '--show-error',
                '--header', '@-',
                '--form-string', "metadata=${groovy.json.JsonOutput.toJson(metadata)}",
                '--form', "file=@${jarFile}",
                "https://minecraft.curseforge.com/api/projects/${project.kelvin_curse_project_id}/upload-file"
        }
    }
}

// Publish to Modrinth
modrinth {
    token = project.modrinth_api_key
    projectId = project.kelvin_modrinth_project_id
    versionType = vsReleaseType
    versionName = fileDisplayName
    versionNumber = "${project.version}-${project.loader_platform.toLowerCase()}"
    uploadFile = remapJar
    gameVersions = [project.minecraft_version]
    loaders = [project.loader_platform.toLowerCase()]
}
