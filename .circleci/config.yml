version: 2.1

jobs:
  publish_to_curseforge:
    resource_class: large
    docker:
      - image: cimg/openjdk:17.0
    environment:
      ORG_GRADLE_PROJECT_block_external_repositories: "true"
      ORG_GRADLE_PROJECT_CustomReleaseVersion: release/0.5.2
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-gradle-home-{{ checksum "build.gradle" }}-{{ checksum "gradle.properties" }}
            - v1-gradle-home
      - run:
          name: Publish Kelvin 0.5.2 to CurseForge
          command: |
            : "${ORG_GRADLE_PROJECT_curse_api_key:?Set the CurseForge upload token in curse_publishing}"
            git checkout --detach be273209b2e1fd515910a454209948c84aaa82d1
            ./gradlew build :fabric:curseforge :forge:curseforge --no-daemon --stacktrace --max-workers 1

workflows:
  curseforge_0_5_2_retry:
    jobs:
      - publish_to_curseforge:
          context:
            - curse_publishing
            - valkyrien_maven
          filters:
            branches:
              only: 1.20.x/curseforge-0.5.2-retry
